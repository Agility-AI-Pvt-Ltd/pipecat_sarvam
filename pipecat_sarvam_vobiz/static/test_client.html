<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vobiz WebSocket Test Client</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #101413;
        --panel: #171d1b;
        --text: #eef6f2;
        --muted: #9fb1aa;
        --line: #304039;
        --accent: #2dbb7f;
        --danger: #e45757;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      main {
        width: min(920px, calc(100vw - 32px));
        margin: 0 auto;
        padding: 28px 0;
      }

      h1 {
        margin: 0 0 18px;
        font-size: 24px;
        line-height: 1.2;
        font-weight: 700;
        letter-spacing: 0;
      }

      .panel {
        border: 1px solid var(--line);
        background: var(--panel);
        border-radius: 8px;
        padding: 16px;
      }

      .controls {
        display: grid;
        grid-template-columns: 1fr auto auto;
        gap: 10px;
        align-items: end;
      }

      label {
        display: grid;
        gap: 6px;
        color: var(--muted);
        font-size: 13px;
      }

      input {
        width: 100%;
        height: 40px;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 0 10px;
        background: #0c100f;
        color: var(--text);
        font: inherit;
      }

      button {
        height: 40px;
        border: 0;
        border-radius: 6px;
        padding: 0 14px;
        color: #04120d;
        background: var(--accent);
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      button.secondary {
        background: #26342f;
        color: var(--text);
        border: 1px solid var(--line);
      }

      button.danger {
        background: var(--danger);
        color: #fff;
      }

      button:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 10px;
        margin: 14px 0;
      }

      .stat {
        min-height: 64px;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 10px;
        background: #111715;
      }

      .stat span {
        display: block;
        color: var(--muted);
        font-size: 12px;
      }

      .stat strong {
        display: block;
        margin-top: 6px;
        font-size: 18px;
        letter-spacing: 0;
      }

      pre {
        height: min(46vh, 420px);
        margin: 0;
        overflow: auto;
        white-space: pre-wrap;
        word-break: break-word;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 12px;
        background: #080b0a;
        color: #c9d8d2;
        font-size: 12px;
        line-height: 1.5;
      }

      @media (max-width: 720px) {
        .controls {
          grid-template-columns: 1fr;
        }

        .stats {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Vobiz WebSocket Test Client</h1>
      <section class="panel">
        <div class="controls">
          <label>
            WebSocket URL
            <input id="wsUrl" autocomplete="off" />
          </label>
          <button id="startBtn">Start</button>
          <button id="stopBtn" class="danger" disabled>Stop</button>
        </div>
        <div class="stats">
          <div class="stat"><span>Status</span><strong id="status">Idle</strong></div>
          <div class="stat"><span>Sample Rate</span><strong id="rate">16000</strong></div>
          <div class="stat"><span>Sent Frames</span><strong id="sent">0</strong></div>
          <div class="stat"><span>Received Audio</span><strong id="received">0</strong></div>
        </div>
        <pre id="log"></pre>
      </section>
    </main>

    <script>
      const TARGET_RATE = 16000;
      const FRAME_SAMPLES = 320;
      const FRAME_BYTES = FRAME_SAMPLES * 2;

      const elements = {
        wsUrl: document.getElementById("wsUrl"),
        startBtn: document.getElementById("startBtn"),
        stopBtn: document.getElementById("stopBtn"),
        status: document.getElementById("status"),
        rate: document.getElementById("rate"),
        sent: document.getElementById("sent"),
        received: document.getElementById("received"),
        log: document.getElementById("log"),
      };

      const state = {
        ws: null,
        micStream: null,
        audioContext: null,
        captureNode: null,
        sourceNode: null,
        silentGain: null,
        sentFrames: 0,
        receivedAudio: 0,
        sequence: 0,
        mediaChunk: 0,
        streamId: crypto.randomUUID(),
        callId: crypto.randomUUID(),
        resampler: {
          remainder: new Float32Array(0),
          sourcePosition: 0,
        },
        pcmQueue: new Uint8Array(0),
        playbackTime: 0,
      };

      elements.wsUrl.value = defaultWsUrl();
      elements.rate.textContent = String(TARGET_RATE);

      elements.startBtn.addEventListener("click", start);
      elements.stopBtn.addEventListener("click", stop);

      function defaultWsUrl() {
        const protocol = location.protocol === "https:" ? "wss:" : "ws:";
        const host = location.host || "127.0.0.1:8000";
        return `${protocol}//${host}/vobiz/ws`;
      }

      async function start() {
        try {
          resetCounters();
          setStatus("Starting");
          elements.startBtn.disabled = true;

          if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            throw new Error("Microphone access requires http://localhost, http://127.0.0.1, or HTTPS.");
          }

          state.audioContext = new AudioContext();
          await state.audioContext.resume();
          state.playbackTime = state.audioContext.currentTime;

          const wsUrl = normalizeWsUrl(elements.wsUrl.value.trim());
          elements.wsUrl.value = wsUrl;
          log(`connecting ${wsUrl}`);

          state.ws = new WebSocket(wsUrl);
          state.ws.addEventListener("open", onSocketOpen);
          state.ws.addEventListener("message", onSocketMessage);
          state.ws.addEventListener("close", () => {
            log("websocket closed");
            setStatus("Closed");
            cleanupMedia();
            elements.startBtn.disabled = false;
            elements.stopBtn.disabled = true;
          });
          state.ws.addEventListener("error", () => {
            log("websocket error. Is uvicorn running on this port?");
            setStatus("Error");
            cleanupMedia();
            elements.startBtn.disabled = false;
            elements.stopBtn.disabled = true;
          });
        } catch (error) {
          log(`start failed: ${error.message || error}`);
          setStatus("Error");
          cleanupMedia();
          elements.startBtn.disabled = false;
          elements.stopBtn.disabled = true;
        }
      }

      async function onSocketOpen() {
        try {
          log("websocket open");
          sendStartEvent();

          state.micStream = await navigator.mediaDevices.getUserMedia({
            audio: {
              channelCount: 1,
              echoCancellation: true,
              noiseSuppression: true,
              autoGainControl: true,
            },
            video: false,
          });

          state.sourceNode = state.audioContext.createMediaStreamSource(state.micStream);
          state.captureNode = await createCaptureNode();
          state.silentGain = state.audioContext.createGain();
          state.silentGain.gain.value = 0;

          state.sourceNode.connect(state.captureNode);
          state.captureNode.connect(state.silentGain);
          state.silentGain.connect(state.audioContext.destination);

          elements.startBtn.disabled = true;
          elements.stopBtn.disabled = false;
          setStatus("Streaming");
          log("microphone streaming continuously");
        } catch (error) {
          log(`microphone start failed: ${error.message || error}`);
          setStatus("Error");
          stop();
        }
      }

      async function createCaptureNode() {
        if (state.audioContext.audioWorklet) {
          let workletUrl = null;
          try {
            workletUrl = URL.createObjectURL(
              new Blob(
                [
                  `
                  class MicCaptureProcessor extends AudioWorkletProcessor {
                    process(inputs) {
                      const channel = inputs[0] && inputs[0][0];
                      if (channel) this.port.postMessage(channel.slice(0));
                      return true;
                    }
                  }
                  registerProcessor("mic-capture-processor", MicCaptureProcessor);
                  `,
                ],
                { type: "application/javascript" },
              ),
            );
            await state.audioContext.audioWorklet.addModule(workletUrl);
            const node = new AudioWorkletNode(state.audioContext, "mic-capture-processor");
            node.port.onmessage = (event) => handleMicSamples(event.data);
            log("audio capture: AudioWorklet");
            return node;
          } catch (error) {
            log(`AudioWorklet unavailable, using fallback: ${error.message || error}`);
          } finally {
            if (workletUrl) URL.revokeObjectURL(workletUrl);
          }
        }

        const node = state.audioContext.createScriptProcessor(4096, 1, 1);
        node.onaudioprocess = (event) => {
          handleMicSamples(event.inputBuffer.getChannelData(0));
        };
        log("audio capture: ScriptProcessor fallback");
        return node;
      }

      function handleMicSamples(samples) {
        if (!isOpen()) return;
        const resampled = resampleFloat32(samples, state.audioContext.sampleRate, TARGET_RATE);
        if (resampled.length) enqueuePcm(floatToPcm16(resampled));
      }

      function normalizeWsUrl(value) {
        if (!value || value === "ws:///vobiz/ws" || value === "wss:///vobiz/ws") {
          return defaultWsUrl();
        }
        if (value.startsWith("/")) {
          return `${location.protocol === "https:" ? "wss:" : "ws:"}//${
            location.host || "127.0.0.1:8000"
          }${value}`;
        }
        return value;
      }

      function sendStartEvent() {
        const startEvent = {
          sequenceNumber: state.sequence++,
          event: "start",
          start: {
            callId: state.callId,
            streamId: state.streamId,
            accountId: "browser-test",
            tracks: ["inbound"],
            mediaFormat: {
              encoding: "audio/x-l16",
              sampleRate: TARGET_RATE,
            },
          },
          extra_headers: "{}",
        };
        state.ws.send(JSON.stringify(startEvent));
        log(`sent start streamId=${state.streamId}`);
      }

      function enqueuePcm(bytes) {
        const merged = new Uint8Array(state.pcmQueue.length + bytes.length);
        merged.set(state.pcmQueue, 0);
        merged.set(bytes, state.pcmQueue.length);
        state.pcmQueue = merged;

        while (state.pcmQueue.length >= FRAME_BYTES) {
          const frame = state.pcmQueue.slice(0, FRAME_BYTES);
          state.pcmQueue = state.pcmQueue.slice(FRAME_BYTES);
          sendMediaFrame(frame);
        }
      }

      function sendMediaFrame(frame) {
        const mediaEvent = {
          sequenceNumber: state.sequence++,
          streamId: state.streamId,
          event: "media",
          media: {
            track: "inbound",
            timestamp: String(Date.now()),
            chunk: ++state.mediaChunk,
            payload: bytesToBase64(frame),
          },
          extra_headers: "{}",
        };
        state.ws.send(JSON.stringify(mediaEvent));
        state.sentFrames += 1;
        elements.sent.textContent = String(state.sentFrames);
      }

      function onSocketMessage(event) {
        let message;
        try {
          message = JSON.parse(event.data);
        } catch {
          log("received non-json message");
          return;
        }

        if (message.event === "playAudio" && message.media && message.media.payload) {
          state.receivedAudio += 1;
          elements.received.textContent = String(state.receivedAudio);
          playAudioMessage(message.media);
          return;
        }

        if (message.event === "clearAudio") {
          state.playbackTime = state.audioContext.currentTime;
          log("received clearAudio");
          return;
        }

        if (message.event === "stop") {
          log("received stop");
          stop();
          return;
        }

        log(`received ${message.event || "message"}`);
      }

      function playAudioMessage(media) {
        const sampleRate = Number(media.sampleRate || TARGET_RATE);
        const contentType = media.contentType || "audio/x-l16";
        const bytes = base64ToBytes(media.payload);

        if (contentType !== "audio/x-l16") {
          log(`cannot play ${contentType} in browser test page`);
          return;
        }

        const samples = pcm16ToFloat(bytes);
        const buffer = state.audioContext.createBuffer(1, samples.length, sampleRate);
        buffer.copyToChannel(samples, 0);

        const source = state.audioContext.createBufferSource();
        source.buffer = buffer;
        source.connect(state.audioContext.destination);

        const startAt = Math.max(state.audioContext.currentTime + 0.02, state.playbackTime);
        source.start(startAt);
        state.playbackTime = startAt + buffer.duration;
      }

      async function stop() {
        if (isOpen()) {
          state.ws.close();
        }
        cleanupMedia();
        elements.startBtn.disabled = false;
        elements.stopBtn.disabled = true;
        setStatus("Stopped");
      }

      function cleanupMedia() {
        if (state.captureNode) state.captureNode.disconnect();
        if (state.sourceNode) state.sourceNode.disconnect();
        if (state.silentGain) state.silentGain.disconnect();
        if (state.micStream) state.micStream.getTracks().forEach((track) => track.stop());
        state.captureNode = null;
        state.sourceNode = null;
        state.silentGain = null;
        state.micStream = null;
      }

      function resampleFloat32(input, sourceRate, targetRate) {
        let source = input;
        if (state.resampler.remainder.length) {
          source = new Float32Array(state.resampler.remainder.length + input.length);
          source.set(state.resampler.remainder, 0);
          source.set(input, state.resampler.remainder.length);
        }

        if (sourceRate === targetRate) {
          state.resampler.remainder = new Float32Array(0);
          state.resampler.sourcePosition = 0;
          return source;
        }

        const ratio = sourceRate / targetRate;
        const output = [];
        let pos = state.resampler.sourcePosition;

        while (pos + 1 < source.length) {
          const index = Math.floor(pos);
          const fraction = pos - index;
          const sample = source[index] + (source[index + 1] - source[index]) * fraction;
          output.push(sample);
          pos += ratio;
        }

        const consumed = Math.floor(pos);
        state.resampler.remainder = source.slice(consumed);
        state.resampler.sourcePosition = pos - consumed;
        return Float32Array.from(output);
      }

      function floatToPcm16(floatSamples) {
        const bytes = new Uint8Array(floatSamples.length * 2);
        const view = new DataView(bytes.buffer);
        for (let i = 0; i < floatSamples.length; i += 1) {
          const sample = Math.max(-1, Math.min(1, floatSamples[i]));
          view.setInt16(i * 2, sample < 0 ? sample * 0x8000 : sample * 0x7fff, true);
        }
        return bytes;
      }

      function pcm16ToFloat(bytes) {
        const view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
        const samples = new Float32Array(bytes.byteLength / 2);
        for (let i = 0; i < samples.length; i += 1) {
          samples[i] = view.getInt16(i * 2, true) / 0x8000;
        }
        return samples;
      }

      function bytesToBase64(bytes) {
        let binary = "";
        const chunkSize = 8192;
        for (let i = 0; i < bytes.length; i += chunkSize) {
          binary += String.fromCharCode(...bytes.slice(i, i + chunkSize));
        }
        return btoa(binary);
      }

      function base64ToBytes(base64) {
        const binary = atob(base64);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i += 1) {
          bytes[i] = binary.charCodeAt(i);
        }
        return bytes;
      }

      function resetCounters() {
        state.sentFrames = 0;
        state.receivedAudio = 0;
        state.sequence = 0;
        state.mediaChunk = 0;
        state.streamId = crypto.randomUUID();
        state.callId = crypto.randomUUID();
        state.resampler.remainder = new Float32Array(0);
        state.resampler.sourcePosition = 0;
        state.pcmQueue = new Uint8Array(0);
        elements.sent.textContent = "0";
        elements.received.textContent = "0";
        elements.log.textContent = "";
      }

      function isOpen() {
        return state.ws && state.ws.readyState === WebSocket.OPEN;
      }

      function setStatus(value) {
        elements.status.textContent = value;
      }

      function log(message) {
        const time = new Date().toLocaleTimeString();
        elements.log.textContent += `[${time}] ${message}\n`;
        elements.log.scrollTop = elements.log.scrollHeight;
      }
    </script>
  </body>
</html>
