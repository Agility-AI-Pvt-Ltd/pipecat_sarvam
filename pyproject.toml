[project]
name = "pipecat-sarvam-vobiz"
version = "0.1.0"
description = "FastAPI voice agent using Vobiz realtime audio streams, Pipecat, and Sarvam STT."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pipecat-ai[sarvam]>=0.0.108",
    "python-dotenv>=1.0.1",
]

[project.scripts]
pipecat-sarvam-vobiz = "pipecat_sarvam_vobiz.main:run"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"
