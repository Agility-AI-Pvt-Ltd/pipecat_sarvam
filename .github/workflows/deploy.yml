name: CI and production deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pipecat-sarvam-production
  cancel-in-progress: false

# GitHub holds only SSH deploy credentials. App config (.env) lives on the EC2
# box and is never uploaded, downloaded, or overwritten by this workflow.
#
# Repository secrets (the names already in this repo):
#   EC2_HOST
#   EC2_USER
#   EC2_SSH_KEY
#   EC2_APP_DIR     → /home/ubuntu/pipecat_sarvam
# Optional: EC2_SSH_PORT (defaults to 22)

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check deploy secrets
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY || secrets.EC2_SSH_PRIVATE_KEY }}
          EC2_APP_DIR: ${{ secrets.EC2_APP_DIR || secrets.DEPLOY_PATH }}
        run: |
          missing=0
          [[ -n "$EC2_HOST" ]] || { echo "::error::Missing secret EC2_HOST"; missing=1; }
          [[ -n "$EC2_USER" ]] || { echo "::error::Missing secret EC2_USER"; missing=1; }
          [[ -n "$EC2_SSH_KEY" ]] || { echo "::error::Missing secret EC2_SSH_KEY"; missing=1; }
          [[ -n "$EC2_APP_DIR" ]] || { echo "::error::Missing secret EC2_APP_DIR"; missing=1; }
          exit "$missing"

      - name: Snapshot host .env so this job cannot replace it
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY || secrets.EC2_SSH_PRIVATE_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || 22 }}
          script: |
            set -Eeuo pipefail
            dest="${{ secrets.EC2_APP_DIR || secrets.DEPLOY_PATH }}"
            rm -f /tmp/pipecat-sarvam.env.ci-keep
            if [[ -f "$dest/.env" ]]; then
              cp -a "$dest/.env" /tmp/pipecat-sarvam.env.ci-keep
            fi

      - name: Upload release source
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY || secrets.EC2_SSH_PRIVATE_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || 22 }}
          rm: false
          # .env is excluded: OPENAI_API_KEY and friends stay on the box.
          source: '.,!.git,!.env,!.venv,!.venv311,!for-voice.pem,!*.pem,!graphify-out,!__pycache__,!*.pyc'
          target: ${{ secrets.EC2_APP_DIR || secrets.DEPLOY_PATH }}

      - name: Restore host .env and deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY || secrets.EC2_SSH_PRIVATE_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || 22 }}
          command_timeout: 20m
          script: |
            set -Eeuo pipefail
            dest="${{ secrets.EC2_APP_DIR || secrets.DEPLOY_PATH }}"
            cd "$dest"
            if [[ -f /tmp/pipecat-sarvam.env.ci-keep ]]; then
              cp -a /tmp/pipecat-sarvam.env.ci-keep "$dest/.env"
              rm -f /tmp/pipecat-sarvam.env.ci-keep
            elif [[ ! -f .env ]]; then
              echo "No .env on this host. Paste it at $dest/.env once, then re-run." >&2
              exit 1
            fi
            chmod +x scripts/deploy-prod.sh
            ./scripts/deploy-prod.sh
